---
name: CI

# All third-party actions are pinned to immutable commit SHAs
# (instead of floating tags) to protect against supply-chain attacks.
# The original version tag is kept as a trailing comment for readability.
# SHAs are identical to the ones used by the Library CI
# (AstroLumina-Terraform-Library/.github/workflows/library-ci.yml).

# NOTE: no apply ever runs in CI — fmt and validate only.
# NOTE: the validate job resolves lab module sources from the pinned
# AstroLumina-Terraform-Library release tag (`1.0.5`), so this job requires
# that tag and its modules to exist in the Library first. To validate
# against a local Library checkout, use scripts/check-local.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    if: github.event_name != 'push'
    name: Terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.*"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    if: github.event_name != 'push'
    name: Validate (labs, no apply)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.*"

      # Module sources are git:: refs into AstroLumina-Terraform-Library@1.0.5:
      # they resolve from the pinned Library release tag, so this job requires
      # that tag and its modules to exist in the Library first.
      - name: Terraform init (no backend — validation only)
        run: |
          for d in labs/*/; do
            echo "--- $d ---"
            terraform -chdir="$d" init -backend=false -input=false
          done

      - name: Terraform validate (labs)
        run: |
          for d in labs/*/; do
            echo "--- $d ---"
            terraform -chdir="$d" validate -no-color
          done

  semgrep:
    if: github.event_name == 'pull_request'
    name: Semgrep OSS
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.182.0
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Semgrep
        id: semgrep
        run: semgrep --config p/default --jobs 1 --sarif --output=semgrep.sarif
      - name: Upload SARIF to GitHub
        if: always() && steps.semgrep.outcome == 'success'
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy-config:
    if: github.event_name == 'pull_request'
    name: Trivy config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          trivyignores: .trivyignore.yaml
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
